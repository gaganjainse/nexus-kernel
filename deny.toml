[advisories]
ignore = [
  "RUSTSEC-2024-0436",
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0153",
  "RUSTSEC-2017-0008",
  "RUSTSEC-2026-0192",
  "RUSTSEC-2026-0097",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "CC0-1.0",
  "MIT-0",
  "MPL-2.0",
  "LGPL-2.1-or-later",
  "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
