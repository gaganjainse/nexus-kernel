name: PR Checks

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history: the size, conflict, and breaking-change steps all
          # diff against the base. On a shallow clone the base ref is absent,
          # the merge base cannot be computed, and every one of those gates
          # passes while inspecting nothing.
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt, clippy

      - name: Check PR title follows convention
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$TITLE" =~ ^(feat|fix|docs|refactor|test|chore|ci|perf|style)(\(.+\))?: ]]; then
            echo "::error::PR title must follow conventional commits: type(scope): description"
            echo "Example: feat(kernel): add task deduplication"
            exit 1
          fi

      - name: Check PR size
        run: |
          LINES=$(git diff --stat origin/${{ github.base_ref }} | tail -1 | awk '{print $4}')
          if [ "$LINES" -gt 500 ]; then
            echo "::warning::PR is large ($LINES lines). Consider splitting into smaller PRs."
          fi

      - name: Verify no merge conflicts
        env:
          # Passed through the environment rather than interpolated into the
          # script, so a branch name cannot inject shell.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The checkout is shallow, so HEAD and the base may share no history
          # in this clone. merge-tree then fails for want of a merge base and
          # the step read that as a conflict. Deepen first, and match on the
          # CONFLICT marker rather than an exit code that means several things.
          git fetch --deepen=100 origin "$BASE_REF" 2>/dev/null \
            || git fetch origin "$BASE_REF"
          base=$(git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || true)
          if [ -z "$base" ]; then
            echo "::notice::no common ancestor in this shallow clone; skipping"
            exit 0
          fi
          if git merge-tree --write-tree HEAD "origin/$BASE_REF" 2>&1 \
             | grep -q "^CONFLICT"; then
            echo "::error::PR has merge conflicts"
            exit 1
          fi
          echo "No merge conflicts."

      - name: Check for breaking changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }} | grep -E "^crates/.*/src/lib.rs$|^Cargo.toml$"; then
            echo "::warning::PR modifies crate lib.rs or Cargo.toml - may be a breaking change"
          fi

      - name: Run fmt check
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check test coverage
        run: |
          TOTAL=$(cargo test --workspace 2>&1 | grep "test result:" | awk '{print $4}' | sed 's/;//g' | tr '\n' '+' | sed 's/+$//' | bc 2>/dev/null || echo "0")
          if [ "$TOTAL" -lt 100 ]; then
            echo "::warning::Test count ($TOTAL) is below threshold (100). Add more tests."
          fi

  auto-merge:
    name: Auto-merge Dependencies
    runs-on: ubuntu-24.04
    needs: pr-validation
    if: github.event.pull_request.draft == false && github.actor == 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'dependencies')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash'
            })
