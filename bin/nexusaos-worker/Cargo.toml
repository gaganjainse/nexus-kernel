[package]
name = "nexusaos-worker"
version = "0.1.0"
edition = "2021"
description = "NexusAOS isolated worker process for tool execution"
license = "MIT"

[[bin]]
name = "nexusaos-worker"
path = "src/main.rs"

[dependencies]
nexusaos-kernel.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
