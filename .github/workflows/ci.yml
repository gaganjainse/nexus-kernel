name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check for unwrap/expect in production code
        run: |
          if grep -rn "\.unwrap()\|\.expect(" crates/ bin/ --include="*.rs" | grep -v "tests\|#\[cfg(test)\]\|#\[allow" | grep -v "^.*//.*unwrap\|//.*expect"; then
            echo "::error::Found unwrap/expect in production code"
            exit 1
          fi

  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib --workspace

      - name: Run integration tests
        run: cargo test --workspace --tests

      - name: Run doc tests
        run: cargo test --workspace --doc

      - name: Report test count
        run: |
          TOTAL=$(cargo test --workspace 2>&1 | grep -oP '\d+(?= passed)' | paste -sd+ | bc)
          echo "Total tests: $TOTAL"
          if [ "$TOTAL" -lt 900 ]; then
            echo "::error::Test count ($TOTAL) dropped below 900. Check for accidental test deletions."
            exit 1
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0153 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2017-0008 --ignore RUSTSEC-2026-0192 --ignore RUSTSEC-2026-0002

  supply-chain:
    name: Supply Chain Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny check
        run: cargo deny check

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release
        run: cargo build --release --workspace

  architecture:
    name: Architecture Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify architecture artifact exists
        run: |
          if [ ! -f ".kilo/plans/architecture.md" ]; then
            echo "::error::Missing architecture.md artifact"
            exit 1
          fi

      - name: Validate Mermaid diagrams
        run: |
          if ! grep -q '```mermaid' .kilo/plans/architecture.md; then
            echo "::error::No Mermaid diagrams found in architecture.md"
            exit 1
          fi
